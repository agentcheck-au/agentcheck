name: AgentCheck checks
on:
  push:
    branches: [studio-redesign]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - name: Inspect AgentCheck preview-only OneGov fetch diagnostics
        run: |
          node --input-type=module <<'EOF'
          const url = "https://diagnose-nsw-oauth-connectivity.agentcheck-3o4.pages.dev/api/diagnostic-onegov";
          try {
            const r = await fetch(url, { signal: AbortSignal.timeout(15000) });
            console.log("preview_probe_status", r.status);
            const data = await r.json();
            console.log("preview_probe_results", JSON.stringify(data));
          } catch (e) {
            console.log("preview_probe_failed", e.name, e.cause?.code || "");
          }
          EOF

      - name: Diagnose public NSW OneGov DNS and TLS without credentials
        run: |
          node --input-type=module <<'EOF'
          import dns from "node:dns/promises";
          const host = "api.onegov.nsw.gov.au";
          try {
            const addresses = await dns.lookup(host, { all: true });
            console.log("nsw_dns", { ok: true, count: addresses.length, families: [...new Set(addresses.map(a => a.family))] });
          } catch (e) {
            console.log("nsw_dns", { ok: false, code: e.code || e.name });
          }
          try {
            const r = await fetch("https://" + host + "/oauth/client_credential/accesstoken?grant_type=client_credentials", {
              headers: { Accept: "application/json" },
              redirect: "manual",
              signal: AbortSignal.timeout(10000),
            });
            console.log("nsw_http_no_credentials", { status: r.status, contentType: r.headers.get("content-type"), locationHost: r.headers.get("location") ? new URL(r.headers.get("location"), r.url).host : null });
          } catch (e) {
            console.log("nsw_http_no_credentials", { ok: false, name: e.name, causeCode: e.cause?.code || null });
          }
          EOF
